# Publishes to PyPI with trusted publishing (OIDC). No API token is stored.
# Stays idle until a v* tag or a GitHub release, and until PyPI has a pending
# publisher for this workflow and the `pypi` environment.
name: publish
on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  pypi:
    if: github.repository == 'humdings/factorflow'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/factorflow/
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
